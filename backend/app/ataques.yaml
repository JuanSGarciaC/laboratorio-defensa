# Catálogo de ataques. Cada uno lleva su prueba objetiva de éxito ("exito"):
#   contiene: alguna respuesta trae ese texto      estado: alguna respuesta tiene ese código
# Las rutas son relativas al objetivo; el lanzador antepone el modo (/vulnerable o /endurecida).
- id: inyeccion-sql
  nombre: Inyección SQL
  descripcion: La búsqueda arma el SQL pegando el texto del visitante. Con UNION se le añade una segunda consulta que devuelve la tabla de usuarios.
  owasp: "A03:2021 Inyección"
  attack: T1190
  cwe: CWE-89
  falla: El texto del visitante se pega dentro de la consulta, así que puede cambiar el SQL que se ejecuta.
  defensa: El texto viaja como parámetro (LIKE ?) y la base nunca lo interpreta como SQL.
  funcion: buscar
  peticiones:
    - {metodo: GET, ruta: /buscar, params: {q: "' UNION SELECT email, clave FROM usuarios --"}}
  exito: {contiene: "admin@lab.invalid"}

- id: xss-reflejado
  nombre: XSS reflejado
  descripcion: La página devuelve el término buscado sin escapar. Si es una etiqueta script, el navegador de la víctima la ejecutaría.
  owasp: "A03:2021 Inyección"
  attack: T1059.007
  cwe: CWE-79
  falla: El término buscado vuelve a la página sin escapar, así que una etiqueta script llega viva al navegador.
  defensa: El término se escapa con html.escape antes de mostrarlo y llega como texto inofensivo.
  funcion: buscar
  peticiones:
    - {metodo: GET, ruta: /buscar, params: {q: "<script>alert(1)</script>"}}
  exito: {contiene: "<script>alert(1)</script>"}

- id: recorrido-rutas
  nombre: Recorrido de rutas
  descripcion: La descarga une el nombre pedido a la carpeta pública sin comprobar dónde termina. Con ../ se sale de ella y lee un archivo que no debía servirse.
  owasp: "A01:2021 Pérdida de control de acceso"
  attack: T1190
  cwe: CWE-22
  falla: Une el nombre pedido a la carpeta pública sin comprobar dónde termina la ruta, así que ../ sale de ella.
  defensa: Resuelve la ruta y exige que siga dentro de la carpeta pública; si no, responde 404.
  funcion: archivo
  peticiones:
    - {metodo: GET, ruta: /archivo, params: {nombre: "../secreto.txt"}}
    - {metodo: GET, ruta: /archivo, params: {nombre: "publico/../../secreto.txt"}}
  exito: {contiene: "SENUELO-LAB-7f3a"}

- id: fuerza-bruta
  nombre: Fuerza bruta de login
  descripcion: Veinte contraseñas comunes contra la cuenta admin, una tras otra. Sin límite de intentos, alguna acaba entrando.
  owasp: "A07:2021 Fallos de identificación y autenticación"
  attack: T1110.001
  cwe: CWE-307
  falla: No hay límite de intentos, así que se puede probar una contraseña tras otra hasta acertar.
  defensa: Cinco fallos en un minuto bloquean la cuenta (429), aunque después llegue la contraseña correcta.
  funcion: login
  peticiones:
    - {metodo: POST, ruta: /login, cuerpo: {usuario: admin, clave: "123456"}}
    - {metodo: POST, ruta: /login, cuerpo: {usuario: admin, clave: "password"}}
    - {metodo: POST, ruta: /login, cuerpo: {usuario: admin, clave: "admin"}}
    - {metodo: POST, ruta: /login, cuerpo: {usuario: admin, clave: "qwerty"}}
    - {metodo: POST, ruta: /login, cuerpo: {usuario: admin, clave: "111111"}}
    - {metodo: POST, ruta: /login, cuerpo: {usuario: admin, clave: "abc123"}}
    - {metodo: POST, ruta: /login, cuerpo: {usuario: admin, clave: "letmein"}}
    - {metodo: POST, ruta: /login, cuerpo: {usuario: admin, clave: "admin123"}}
    - {metodo: POST, ruta: /login, cuerpo: {usuario: admin, clave: "iloveyou"}}
    - {metodo: POST, ruta: /login, cuerpo: {usuario: admin, clave: "monkey"}}
    - {metodo: POST, ruta: /login, cuerpo: {usuario: admin, clave: "colombia"}}
    - {metodo: POST, ruta: /login, cuerpo: {usuario: admin, clave: "dragon2024"}}
    - {metodo: POST, ruta: /login, cuerpo: {usuario: admin, clave: "futbol"}}
    - {metodo: POST, ruta: /login, cuerpo: {usuario: admin, clave: "welcome"}}
    - {metodo: POST, ruta: /login, cuerpo: {usuario: admin, clave: "sunshine"}}
    - {metodo: POST, ruta: /login, cuerpo: {usuario: admin, clave: "master"}}
    - {metodo: POST, ruta: /login, cuerpo: {usuario: admin, clave: "shadow"}}
    - {metodo: POST, ruta: /login, cuerpo: {usuario: admin, clave: "superman"}}
    - {metodo: POST, ruta: /login, cuerpo: {usuario: admin, clave: "princesa"}}
    - {metodo: POST, ruta: /login, cuerpo: {usuario: admin, clave: "zxcvbnm"}}
  exito: {estado: 200}

- id: idor
  nombre: Acceso a pedido ajeno (IDOR)
  descripcion: Un cliente con sesión pide su pedido y luego cambia el número en la URL. Si el servidor no comprueba de quién es, ve el pedido y la dirección de otra persona.
  owasp: "A01:2021 Pérdida de control de acceso"
  attack: T1190
  cwe: CWE-639
  falla: El pedido se busca solo por su número; nadie comprueba que pertenezca a quien lo pide.
  defensa: La consulta exige que el pedido sea del usuario de la sesión; uno ajeno responde 404, como si no existiera.
  funcion: pedido
  peticiones:
    - {metodo: GET, ruta: /pedido, params: {id: "1"}, cabeceras: {x-sesion: sesion-cliente-lab}}
    - {metodo: GET, ruta: /pedido, params: {id: "2"}, cabeceras: {x-sesion: sesion-cliente-lab}}
  exito: {contiene: "Av. Señuelo 42"}

- id: redireccion-abierta
  nombre: Redirección abierta
  descripcion: El enlace de cerrar sesión acepta a dónde ir después. Con un dominio ajeno, la web legítima envía a la víctima a una página de phishing.
  owasp: "A01:2021 Pérdida de control de acceso"
  attack: T1566.002
  cwe: CWE-601
  falla: Redirige a lo que diga el parámetro siguiente, aunque sea otro dominio.
  defensa: Solo acepta rutas del propio sitio (empiezan por / y no por // ni /\); cualquier otra cosa vuelve a la portada.
  funcion: salir
  peticiones:
    - {metodo: GET, ruta: /salir, params: {siguiente: "https://phishing.invalid/login"}}
    - {metodo: GET, ruta: /salir, params: {siguiente: "//phishing.invalid/login"}}
  exito: {cabecera: location, contiene: "phishing.invalid"}

- id: clickjacking
  nombre: Clickjacking (cabeceras de seguridad)
  descripcion: Una web ajena carga la tienda en un marco invisible y engaña al visitante para que pulse un botón real. Solo funciona si la página permite que la enmarquen.
  owasp: "A05:2021 Configuración de seguridad incorrecta"
  attack: T1189
  cwe: CWE-1021
  falla: La página se sirve sin X-Frame-Options ni CSP frame-ancestors, así que cualquier sitio puede enmarcarla.
  defensa: Envía X-Frame-Options DENY y una CSP con frame-ancestors 'none', además de nosniff y no-referrer.
  funcion: inicio
  peticiones:
    - {metodo: GET, ruta: /inicio}
  exito: {falta: x-frame-options}
